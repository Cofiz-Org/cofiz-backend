name = "cofiz-fcm-relay"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

[vars]
TELEGRAM_CLIENT_ID = "8777989279"

[triggers]
crons = ["*/30 * * * *"]

[[kv_namespaces]]
binding = "OTP_KV"
id = "b5762e0a28664908bb08c1a1b8f35b35"

[[routes]]
pattern = "cofiz.natanim.dev/*"
zone_name = "natanim.dev"

# Secrets (set with `wrangler secret put`):
#   TELEGRAM_BOT_TOKEN
#   WHATSAPP_PHONE_ID
#   WHATSAPP_ACCESS_TOKEN
#   WIPE_BEARER      — bearer for POST /admin/wipe-firestore
#   WIPE_BURN        — set to "true" for one-shot wipe
